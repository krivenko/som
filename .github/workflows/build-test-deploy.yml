name: Build, test and deploy

on:
  push:
    branches:
      - master
      - ci
      - 'dev/**'
  pull_request:
    branches:
      - master
  schedule:
    - cron:  '0 0 * * 6'

# A new push to the same branch makes the running build obsolete: TRIQS is
# rebuilt from source in every job, so letting superseded runs finish would
# occupy the runners for hours for nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; the Ubuntu job widens this to push to gh-pages.
permissions:
  contents: read

jobs:

  #
  # Ubuntu
  #

  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Needed by the documentation deployment step below, which pushes the
    # generated HTML to the gh-pages branch using GITHUB_TOKEN.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: "gcc", cxx: "g++-14", cxxflags: "" }
          - { name: "clang", cxx: "clang++-20", cxxflags: "-stdlib=libc++" }

    env:
      CXXFLAGS: ${{ matrix.compiler.cxxflags }}

    steps:
    - uses: actions/checkout@v6

    - name: Update apt-get cache
      run: sudo apt-get update

    - name: Install APT dependencies
      run: >
        sudo apt-get install
        libboost-dev
        libeigen3-dev
        libomp5
        libomp-dev
        openmpi-bin
        openmpi-common
        openmpi-doc
        libopenmpi-dev
        libblas-dev
        liblapack-dev
        libfftw3-dev
        libgmp-dev
        hdf5-tools
        libhdf5-dev
        python3-dev
        python3-numpy
        python3-scipy
        python3-matplotlib
        ipython3
        python3-mpi4py
        python3-mako

    - name: Install Clang 20
      if: matrix.compiler.name == 'clang'
      run: >
        sudo apt-get install -y
        clang-20
        libomp-20-dev
        libc++-20-dev
        libc++abi-20-dev

    - name: Install Sphinx and related packages
      if: matrix.compiler.name == 'clang'
      run: |
           pip install --upgrade pip
           pip install \
               sphinx nbsphinx linkify-it-py sphinx-rtd-theme myst-parser

    - name: Build & install TRIQS
      env:
        CXX: ${{ matrix.compiler.cxx }}
      run: |
        git clone https://github.com/TRIQS/triqs --branch 4.0.x
        mkdir triqs/build && pushd triqs/build
        cmake ..                                                               \
          -DCMAKE_BUILD_TYPE=Debug                                             \
          -DCMAKE_INSTALL_PREFIX=$HOME/install                                 \
          -DBuild_Tests=OFF
        make -j$(getconf _NPROCESSORS_ONLN) install VERBOSE=1
        popd

    - name: Build SOM
      env:
        CXX: ${{ matrix.compiler.cxx }}
      run: |
        source $HOME/install/share/triqs/triqsvars.sh
        if [[ "${CXX}" == clang* ]]; then
          DOCS="ON"
        else
          DOCS="OFF"
        fi
        mkdir build && pushd build
        cmake ..                                                               \
          -DCMAKE_BUILD_TYPE=Debug                                             \
          -DBUILD_SHARED_LIBS=ON                                               \
          -DBuild_Documentation=${DOCS}
        make -j$(getconf _NPROCESSORS_ONLN) VERBOSE=1
        popd

    - name: Test SOM
      run: |
        # Allow oversubscription, as some tests are run on 4 MPI ranks.
        # ubuntu-latest (24.04) ships OpenMPI 4, which is configured via this
        # file. OpenMPI 5 delegates process mapping to PRRTE and silently
        # ignores the setting below; from Ubuntu 26.04 on, this has to become
        # 'rmaps_default_mapping_policy = :oversubscribe' in
        # $HOME/.prte/mca-params.conf, as done in the macOS job.
        sudo sh -c 'echo -e "\nrmaps_base_oversubscribe = 1" >>                \
          /etc/openmpi/openmpi-mca-params.conf'
        pushd build
        source $HOME/install/share/triqs/triqsvars.sh
        ctest --output-on-failure
        popd

    - name: Deploy documentation
      if: github.ref == 'refs/heads/master' && matrix.compiler.name == 'clang'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        token: ${{ secrets.GITHUB_TOKEN }}
        folder: build/doc/html

  #
  # macOS
  #

  macos:
    name: macOS
    strategy:
      fail-fast: false
      matrix:
        os:
          - "macos-latest"
          # macos-15-intel is probably the last supported macOS x86-64 runner
          # https://github.com/actions/runner-images/issues/13074
          - "macos-15-intel"
        compiler:
          - { name: "gcc", cxx: "g++-15" }
          - { name: "clang", cxx: "clang++" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    steps:
    - uses: actions/checkout@v6

    - name: Update Homebrew formulae
      run: brew update

    - name: Install Homebrew dependencies
      run: brew install llvm libomp open-mpi boost fftw hdf5 numpy scipy mpi4py

    - name: Install Python dependencies
      run: |
           PYTHON_BIN="$(python -c 'import site; print(site.USER_BASE)')/bin"
           echo "PATH=${PYTHON_BIN}:${PATH}" >> $GITHUB_ENV
           pip install --user --upgrade pip
           pip install --user mako

    - name: Set PATH and LDFLAGS for Clang
      if: matrix.compiler.name == 'clang'
      run: |
           PREFIX="$(brew --prefix llvm)"
           echo "PATH=${PREFIX}/bin:${PATH}" >> $GITHUB_ENV
           LDFLAGS="-L${PREFIX}/lib/c++ -L${PREFIX}/lib/unwind -lunwind"
           echo "LDFLAGS=${LDFLAGS}" >> $GITHUB_ENV

    - name: Install Sphinx and related packages
      if: matrix.compiler.name == 'clang'
      run: |
        pip install --user \
          sphinx matplotlib nbsphinx linkify-it-py sphinx-rtd-theme myst-parser

    - name: Build & install TRIQS
      env:
        CXX: ${{ matrix.compiler.cxx }}
      run: |
        git clone https://github.com/TRIQS/triqs --branch 4.0.x
        mkdir triqs/build && pushd triqs/build
        cmake ..                                                               \
          -DCMAKE_BUILD_TYPE=Debug                                             \
          -DCMAKE_INSTALL_PREFIX=$HOME/install                                 \
          -DBuild_Tests=OFF
        make -j$(getconf _NPROCESSORS_ONLN) install VERBOSE=1
        popd

    - name: Build SOM
      env:
        CXX: ${{ matrix.compiler.cxx }}
      run: |
        source $HOME/install/share/triqs/triqsvars.sh
        if [[ "${CXX}" == clang* ]]; then
          DOCS="ON"
        else
          DOCS="OFF"
        fi
        mkdir build && pushd build
        cmake ..                                                               \
          -DCMAKE_BUILD_TYPE=Debug                                             \
          -DBUILD_SHARED_LIBS=ON                                               \
          -DBuild_Documentation=${DOCS}
        make -j$(getconf _NPROCESSORS_ONLN) VERBOSE=1
        popd

    - name: Test SOM
      env:
        TMPDIR: "/tmp"
        # Homebrew's openblas version 0.3.31_1 and newer is linked to libomp.
        # This seems to cause a SEGFAULT in the threaded version of GEMM.
        # C.f. https://github.com/Homebrew/homebrew-core/pull/265549
        OMP_NUM_THREADS: 1
      run: |
        mkdir -p $HOME/.prte
        echo -e "\nrmaps_default_mapping_policy = :oversubscribe" >> \
          $HOME/.prte/mca-params.conf
        pushd build
        source $HOME/install/share/triqs/triqsvars.sh
        ctest --output-on-failure
        popd
